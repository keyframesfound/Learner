<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Learner — boss battle</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: full-screen battle — boss top-right with its status box top-left, party bottom-left with its box bottom-right, cream command panel (dialog + 2×2 answers) along the bottom. Course-app styling: cream paper, 3px ink borders, hard offset shadows. Single light theme by choice. */
:root {
  --paper: #F2EFE6;
  --card: #ffffff;
  --ink: #111111;
  --muted: #8C8A80;
  --orange: #FF4D1C;
  --lime: #D4FF3F;
  --blue: #2D5BFF;
  --green: #0F7A35;
  --head: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--head); }
.screen { min-height: 100%; display: grid; grid-template-rows: auto 1fr auto; }

/* Top bar */
.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px var(--gutter-r) 10px var(--gutter-l); border-bottom: 3px solid var(--ink);
  font: 700 .74rem var(--mono); letter-spacing: .06em; text-transform: uppercase;
}
.top a { color: var(--ink); text-decoration: none; }
.top b { font-variant-numeric: tabular-nums; }

/* Arena */
.arena {
  position: relative; overflow: hidden; min-height: 300px;
  background:
    repeating-linear-gradient(135deg, transparent 0 10px, rgba(17,17,17,.05) 10px 12px) 0 100% / 100% 48% no-repeat,
    var(--paper);
}
.arena::before { content: ""; position: absolute; left: 0; right: 0; top: 52%; border-top: 3px solid var(--ink); }
.platform { position: absolute; border: 3px solid var(--ink); border-radius: 50%; background: var(--card); z-index: 1; }
.platform.boss-p { width: min(40%, 300px); aspect-ratio: 4 / 1; right: 4%; top: calc(8% + min(30vw, 220px) * .86); }
.platform.party-p { width: min(52%, 380px); aspect-ratio: 4 / 1; left: 2%; bottom: 5%; background: var(--lime); }

.actor { position: absolute; z-index: 2; transition: transform .22s cubic-bezier(.3,1.6,.5,1); }
.actor svg { display: block; width: 100%; height: auto; overflow: visible; }
.boss-actor { right: 7%; top: 8%; width: min(30vw, 220px); animation: breathe 2.6s ease-in-out infinite; }
.party { position: absolute; left: 4%; bottom: calc(5% + min(52vw, 380px) / 8); width: min(48%, 340px); display: flex; align-items: flex-end; z-index: 2; }
.party .actor { position: relative; flex: 1; margin-right: -4%; }
.party .actor:nth-child(2) { margin-bottom: -6%; z-index: 3; }
.hero.active::before {
  content: ""; position: absolute; top: -18px; left: 50%; width: 12px; height: 12px; margin-left: -6px;
  background: var(--lime); border: 2.5px solid var(--ink); transform: rotate(45deg); animation: bob .9s ease-in-out infinite;
}
.hero.down { opacity: .35; filter: grayscale(1); }
@keyframes breathe { 50% { translate: 0 -5px; } }
@keyframes bob { 50% { translate: 0 -5px; } }
.lunge { transform: translate(120%, -45%) rotate(8deg); }
.boss-lunge { transform: translate(-30%, 22%) rotate(-6deg); }
.hurt { animation: hurt .45s ease-out; }
@keyframes hurt { 20% { translate: -8px 0; rotate: -4deg; filter: brightness(1.6); } 45% { translate: 7px 0; rotate: 3deg; } 70% { translate: -3px 0; } }
.shake { animation: shake .35s ease-out; }
@keyframes shake { 25% { translate: -6px 3px; } 50% { translate: 5px -3px; } 75% { translate: -2px 1px; } }

/* Status boxes */
.status {
  position: absolute; z-index: 4; width: min(44%, 280px);
  background: var(--card); border: 3px solid var(--ink); border-radius: 6px; padding: 10px 12px;
  box-shadow: 5px 5px 0 var(--orange); display: grid; gap: 6px;
}
.status.boss-s { top: 6%; left: var(--gutter-l); }
.status.party-s { bottom: 14%; right: var(--gutter-r); box-shadow: 5px 5px 0 var(--ink); }
.status .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.status .name { font-weight: 800; font-size: 1.02rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status .lv { font: 700 .72rem var(--mono); color: var(--muted); white-space: nowrap; }
.status .hpline { display: flex; align-items: center; gap: 8px; }
.status .tag { font: 700 .68rem var(--mono); background: var(--ink); color: var(--lime); padding: 1px 5px; border-radius: 2px; }
.pips { flex: 1; display: flex; gap: 3px; }
.pip { flex: 1; height: 12px; border: 2.5px solid var(--ink); border-radius: 2px; transition: background .25s; }
.boss-s .pip { background: var(--orange); }
.party-s .pip { background: var(--lime); }
.pip.gone { background: transparent !important; background-image: repeating-linear-gradient(135deg, transparent 0 3px, rgba(17,17,17,.18) 3px 5px) !important; }
.status .num { font: 700 .74rem var(--mono); text-align: right; font-variant-numeric: tabular-nums; }

.sticker {
  position: absolute; z-index: 5; pointer-events: none;
  font: 800 1.1rem var(--head); text-transform: uppercase; letter-spacing: .02em;
  padding: 5px 10px; border: 3px solid var(--ink); border-radius: 4px; box-shadow: 4px 4px 0 var(--ink);
  animation: stick 1s cubic-bezier(.3,1.6,.5,1) forwards;
}
@keyframes stick { 0% { transform: scale(.3) rotate(-12deg); opacity: 0; } 25% { transform: scale(1.1) rotate(-6deg); opacity: 1; } 75% { transform: scale(1) rotate(-6deg); opacity: 1; translate: 0 -10px; } 100% { opacity: 0; translate: 0 -22px; transform: scale(1) rotate(-6deg); } }
.flash { position: absolute; inset: 0; z-index: 6; background: var(--orange); opacity: 0; pointer-events: none; }
.flash.on { animation: flash .35s ease-out; }
@keyframes flash { 30% { opacity: .25; } }

/* Command panel */
.panel {
  background: var(--paper); color: var(--ink); border-top: 3px solid var(--ink);
  padding: 14px var(--gutter-r) 16px var(--gutter-l); display: grid; gap: 12px;
}
.panel-in { width: 100%; max-width: 900px; margin: 0 auto; display: grid; gap: 12px; }
.dialog { background: var(--card); color: var(--ink); border: 3px solid var(--ink); border-radius: 6px; box-shadow: 0 0 0 3px var(--card) inset, 0 0 0 5px var(--ink) inset; padding: 12px 16px; min-height: 92px; display: grid; gap: 6px; align-content: start; }
.meta { font: 500 .74rem var(--mono); color: var(--muted); }
.meta .t { color: var(--blue); }
.say { margin: 0; font-size: 1.08rem; font-weight: 700; line-height: 1.35; }
.say code, .opt code { font: 700 .92em var(--mono); background: var(--paper); border: 2px solid var(--ink); border-radius: 3px; padding: 0 4px; }
.say .ok { color: var(--green); } .say .no { color: var(--orange); }

.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 10px; width: 100%; min-width: 0; text-align: left; cursor: pointer;
  background: var(--card); color: var(--ink); border: 3px solid var(--ink); border-radius: 6px; padding: 10px 12px;
  font: 700 .98rem var(--head); transition: transform .12s, box-shadow .12s, opacity .2s;
}
.opt:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--orange); }
.opt:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.opt:disabled { cursor: default; }
.opt .chip { width: 30px; height: 30px; flex: none; display: grid; place-items: center; background: var(--lime); border: 3px solid var(--ink); border-radius: 3px; font: 700 .8rem var(--mono); }
.opt .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.answers.wait .opt:not(.right):not(.wrong) { opacity: .35; }
.opt.right { background: var(--lime); box-shadow: 4px 4px 0 var(--ink); }
.opt.right .chip { background: var(--ink); color: var(--lime); }
.opt.wrong { background: var(--orange); }
.opt.wrong .chip { background: var(--ink); color: var(--orange); }
.hint { font: 500 .7rem var(--mono); color: var(--muted); text-align: center; }

/* End overlay */
.banner { position: absolute; inset: 0; z-index: 7; display: grid; place-content: center; justify-items: center; gap: 12px; text-align: center; background: rgba(242,239,230,.93); padding: 16px; }
.banner[hidden] { display: none; }
.banner h2 { margin: 0; font-size: clamp(2rem, 7vw, 3.2rem); font-weight: 800; letter-spacing: -.02em; }
.banner p { margin: 0; font: 500 .85rem var(--mono); color: var(--muted); }
.btn { font: 800 1rem var(--head); background: var(--orange); color: var(--ink); border: 3px solid var(--ink); border-radius: 6px; padding: 12px 26px; cursor: pointer; box-shadow: 4px 4px 0 var(--ink); }
.btn:hover { transform: translate(-1px,-1px); box-shadow: 5px 5px 0 var(--ink); }
.btn:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

@media (max-width: 520px) {
  .boss-actor { width: 40vw; right: 4%; top: 18%; }
  .platform.boss-p { width: 46%; right: 1%; top: calc(18% + 40vw * .86); }
  .status { width: 52%; padding: 8px 10px; }
  .status .name { font-size: .92rem; }
  .party { width: 42%; left: 2%; }
  .platform.party-p { width: 46%; }
  .status.party-s { width: 46%; right: 2%; }
  .opt { padding: 8px 10px; font-size: .9rem; gap: 8px; }
  .opt .chip { width: 26px; height: 26px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<div class="screen">
  <div class="top"><a href="demo2.html#party">← Drill</a><span>Boss battle · Round <b id="round">1</b> · Streak <b id="streak">0</b></span></div>

  <section class="arena" id="arena">
    <div class="status boss-s">
      <div class="row"><span class="name">Mr Eric Chan</span><span class="lv">Unit 1 boss</span></div>
      <div class="hpline"><span class="tag">HP</span><div class="pips" id="bosspips"></div></div>
      <div class="num" id="bossTxt">120 / 120</div>
    </div>
    <div class="platform boss-p"></div>
    <div class="actor boss-actor" id="boss"></div>

    <div class="platform party-p"></div>
    <div class="party">
      <div class="actor hero" id="hero0"></div>
      <div class="actor hero" id="hero1"></div>
      <div class="actor hero" id="hero2"></div>
    </div>
    <div class="status party-s">
      <div class="row"><span class="name" id="activeName">Knight</span><span class="lv">Party</span></div>
      <div class="hpline"><span class="tag">♥</span><div class="pips" id="lives"></div></div>
      <div class="num" id="livesTxt">4 / 4 lives</div>
    </div>

    <div class="flash" id="flash"></div>
    <div class="banner" id="banner" hidden></div>
  </section>

  <section class="panel">
    <div class="panel-in">
      <div class="dialog">
        <div class="meta" id="qmeta"></div>
        <p class="say" id="say"></p>
      </div>
      <div class="answers" id="answers"></div>
      <div class="hint">Press 1–4 to answer · 3 in a row = critical hit</div>
    </div>
  </section>
</div>

<script>
(() => {
  // ---------- Characters (flat SVG, ink outlines) ----------
  const S0 = 'stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
  const SKIN = '#f3d2b3';
  const legs = `<rect x="20" y="72" width="9" height="16" rx="3" fill="#111"/><rect x="35" y="72" width="9" height="16" rx="3" fill="#111"/>`;
  const eyes = y => `<circle cx="27" cy="${y}" r="2.6" fill="#111"/><circle cx="38" cy="${y}" r="2.6" fill="#111"/>`;
  const HEROES = [
    { name: 'Knight', move: 'Shield Bash', svg: `<svg viewBox="0 -6 72 100"><g ${S0}>${legs}
        <rect x="12" y="42" width="40" height="34" rx="10" fill="#D4FF3F"/>
        <path d="M4 48h18v12c0 8-9 13-9 13s-9-5-9-13z" fill="#fff"/><path d="M13 52v14"/>
        <circle cx="32" cy="26" r="17" fill="#fff"/><rect x="19" y="22" width="26" height="8" rx="3" fill="#111"/>
        <path d="M32 9c4-8 12-9 16-6-5 1-8 4-9 9" fill="#FF4D1C"/>
        <rect x="56" y="8" width="7" height="46" rx="2" fill="#fff"/><rect x="50" y="52" width="19" height="6" rx="2" fill="#111"/><rect x="57" y="58" width="5" height="12" rx="2" fill="#111"/>
      </g></svg>` },
    { name: 'Mage', move: 'Arcane Bolt', svg: `<svg viewBox="0 -14 72 108"><g ${S0}>${legs}
        <path d="M10 76l6-34h32l6 34z" fill="#2D5BFF"/>
        <circle cx="32" cy="30" r="15" fill="#fff"/>${eyes(31)}
        <path d="M10 20h44L36 -10z" fill="#2D5BFF"/><path d="M8 20h48"/>
        <path d="M60 4v84"/><circle cx="60" cy="0" r="7" fill="#D4FF3F"/>
      </g></svg>` },
    { name: 'Archer', move: 'Piercing Shot', svg: `<svg viewBox="0 -6 72 100"><g ${S0}>${legs}
        <rect x="12" y="42" width="40" height="34" rx="10" fill="#FF4D1C"/><path d="M12 46L32 66 52 46" fill="none"/>
        <path d="M14 30c0-14 8-22 18-22s18 8 18 22v8H14z" fill="#0F7A35"/>
        <circle cx="32" cy="30" r="12" fill="#fff"/>${eyes(31)}
        <path d="M58 14q16 32 0 64" fill="none"/><path d="M58 14v64" stroke-width="1.5"/>
      </g></svg>` },
  ];
  // The boss: big drawn caricature — full black mushroom hair with a heavy fringe and stray tufts,
  // thin gold octagonal glasses, wide round face and open grin, white shirt, slim charcoal tie, empty hands.
  const BOSS_SVG = `<svg viewBox="0 0 180 176"><g ${S0}>
      <rect x="12" y="120" width="26" height="50" rx="13" fill="#fff"/><rect x="142" y="120" width="26" height="50" rx="13" fill="#fff"/>
      <rect x="78" y="98" width="24" height="20" fill="${SKIN}"/>
      <rect x="30" y="112" width="120" height="64" rx="26" fill="#fff"/>
      <path d="M90 132v44" stroke-width="2"/><circle cx="96" cy="148" r="1.6" fill="#111" stroke="none"/><circle cx="96" cy="164" r="1.6" fill="#111" stroke="none"/>
      <path d="M66 112l24 20-11-26z" fill="#fff"/><path d="M114 112l-24 20 11-26z" fill="#fff"/>
      <path d="M85 122h10l-2 8h-6z" fill="#3d3d3d"/><path d="M86 130h8l3 44h-14z" fill="#3d3d3d"/>
      <rect x="106" y="140" width="32" height="14" rx="2" fill="#D4FF3F" stroke-width="2.5"/>
      <text x="122" y="150.5" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="8.5" fill="#111" stroke="none">BOSS</text>
      <path d="M28 80C16 28 50 6 90 6s74 22 62 74l-10 2V60H38v22z" fill="#111"/>
      <circle cx="37" cy="80" r="8" fill="${SKIN}"/><circle cx="143" cy="80" r="8" fill="${SKIN}"/>
      <path d="M40 58c0-24 100-24 100 0v22c0 24-24 36-50 36S40 104 40 80z" fill="${SKIN}"/>
      <circle cx="54" cy="92" r="7" fill="#FF4D1C" opacity=".22" stroke="none"/><circle cx="126" cy="92" r="7" fill="#FF4D1C" opacity=".22" stroke="none"/>
      <path d="M37 68C32 30 58 12 90 12s58 18 53 56l-7-9-5 5-6-8-6 6-7-8-6 6-7-7-6 6-6-7-7 7-6-6-6 8-6-6-5 6z" fill="#111"/>
      <path d="M60 24q8 12 4 26M80 18q6 14 2 30M102 19q-2 14 0 28M122 26q-6 12-2 24" stroke="#3a3a3a" stroke-width="2" fill="none"/>
      <path d="M87 13c-4-14 4-20 10-18M95 13c4-10 12-10 15-6" fill="none" stroke-width="2.5"/>
      <ellipse cx="70" cy="75" rx="4.2" ry="3" fill="#111" stroke="none"/><ellipse cx="110" cy="75" rx="4.2" ry="3" fill="#111" stroke="none"/>
      <path d="M63 71q7-4.5 14 0M103 71q7-4.5 14 0" fill="none" stroke-width="2"/>
      <g stroke="#8a7240" stroke-width="2.5" fill="#fff" fill-opacity=".2">
        <path d="M61 62h18l6 6v12l-6 6H61l-6-6V68z"/><path d="M101 62h18l6 6v12l-6 6h-18l-6-6V68z"/>
        <path d="M85 70q5-4 10 0M55 68l-15-2M125 68l15-2" fill="none"/></g>
      <path d="M90 82q-4 8 2 10" fill="none" stroke-width="2.5"/>
      <path d="M71 98q19 17 38 0q-19 3-38 0z" fill="#8a3b36"/>
      <path d="M74 99.2q16 3 32 0l-2 4.5q-14 3-28 0z" fill="#fff" stroke="none"/>
      <circle cx="25" cy="170" r="9" fill="${SKIN}"/><circle cx="155" cy="170" r="9" fill="${SKIN}"/>
    </g></svg>`;
  HEROES.forEach((h, i) => document.getElementById('hero' + i).innerHTML = h.svg);
  document.getElementById('boss').innerHTML = BOSS_SVG;

  // ---------- Questions: Unit 1 topics ----------
  const BANK = [
    { t:'What a name is', q:'After <code>a = [1, 2]</code> and <code>b = a</code>, how many list objects exist?', a:['One','Two','Zero','Depends on b'], c:0 },
    { t:'What a name is', q:'In Python, a variable name is best described as…', a:['A box holding a value','A label for an object','A fixed memory address','A copy of the value'], c:1 },
    { t:'Assignment and rebinding', q:'What does <code>x = 5; x = x + 1; print(x)</code> show?', a:['5','6','x + 1','An error'], c:1 },
    { t:'Assignment and rebinding', q:'After <code>a = 3; b = a; a = 10</code>, what is <code>b</code>?', a:['10','3','None','13'], c:1 },
    { t:'Assignment and rebinding', q:'After <code>a, b = 1, 2; a, b = b, a</code>, what is <code>a</code>?', a:['1','2','(1, 2)','An error'], c:1 },
    { t:'Valid identifiers', q:'Which of these is a valid Python name?', a:['<code>2fast</code>','<code>my-name</code>','<code>_total</code>','<code>class</code>'], c:2 },
    { t:'Valid identifiers', q:'Why is <code>for = 3</code> an error?', a:['Names need 4+ letters','<code>for</code> is a keyword','Numbers need quotes','Missing a colon'], c:1 },
    { t:'Valid identifiers', q:'Are <code>Score</code> and <code>score</code> the same name?', a:['Yes, case is ignored','No, case-sensitive','Only in functions','Only for numbers'], c:1 },
    { t:'Types and conversion', q:'What is <code>int("7") + 3</code>?', a:['"73"','10','73','An error'], c:1 },
    { t:'Types and conversion', q:'What does <code>type(3.0)</code> return?', a:['<code>int</code>','<code>str</code>','<code>float</code>','<code>number</code>'], c:2 },
    { t:'Indexing a list', q:'Given <code>xs = [10, 20, 30]</code>, what is <code>xs[-1]</code>?', a:['10','20','30','IndexError'], c:2 },
    { t:'Indexing a list', q:'Given <code>xs = [10, 20, 30]</code>, what is <code>xs[1]</code>?', a:['10','20','30','IndexError'], c:1 },
  ];

  // ---------- State ----------
  const SEG = 6, SEG_HP = 20, LIVES = 4;
  const $ = id => document.getElementById(id);
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const replay = (el, c) => { el.classList.remove(c); void el.offsetWidth; el.classList.add(c); };
  let S, runId = 0;

  $('lives').innerHTML = '<div class="pip"></div>'.repeat(LIVES);
  $('bosspips').innerHTML = '<div class="pip"></div>'.repeat(SEG);

  // Typewriter for plain battle messages
  async function type(text, cls = '') {
    const id = runId, el = $('say');
    el.innerHTML = cls ? `<span class="${cls}"></span>` : '';
    const target = cls ? el.firstChild : el;
    for (let i = 1; i <= text.length; i++) {
      if (id !== runId) return;
      target.textContent = text.slice(0, i);
      await wait(16);
    }
  }

  async function reset() {
    runId++;
    S = { boss: SEG, lives: LIVES, turn: 0, streak: 0, round: 1, deck: shuffle(BANK), cur: null, locked: true };
    HEROES.forEach((_, i) => $('hero' + i).classList.remove('down'));
    $('boss').style.opacity = '1';
    $('banner').hidden = true;
    $('answers').innerHTML = ''; $('qmeta').textContent = '';
    render();
    await type('Mr Eric Chan blocks the path! Answer right to strike.');
    await wait(900);
    next();
  }
  function render() {
    [...$('lives').children].forEach((p, i) => p.classList.toggle('gone', i >= S.lives));
    [...$('bosspips').children].forEach((p, i) => p.classList.toggle('gone', i >= S.boss));
    $('livesTxt').textContent = `${S.lives} / ${LIVES} lives`;
    $('bossTxt').textContent = `${S.boss * SEG_HP} / ${SEG * SEG_HP}`;
    $('activeName').textContent = HEROES[S.turn].name;
    $('round').textContent = S.round; $('streak').textContent = S.streak;
    HEROES.forEach((_, i) => $('hero' + i).classList.toggle('active', i === S.turn && S.lives > 0 && S.boss > 0));
  }
  function next() {
    if (!S.deck.length) S.deck = shuffle(BANK);
    const raw = S.deck.pop(), order = shuffle([0, 1, 2, 3]);
    S.cur = { ...raw, a: order.map(i => raw.a[i]), c: order.indexOf(raw.c) };
    const h = HEROES[S.turn];
    $('qmeta').innerHTML = `<span class="t">${raw.t}</span> · ${h.name} readies ${h.move}`;
    $('say').innerHTML = raw.q;
    const box = $('answers'); box.innerHTML = ''; box.classList.remove('wait');
    S.cur.a.forEach((txt, i) => {
      const b = document.createElement('button');
      b.className = 'opt'; b.id = 'ans' + i; b.type = 'button';
      b.innerHTML = `<span class="chip">${i + 1}</span><span class="txt">${txt}</span>`;
      b.onclick = () => answer(i);
      box.appendChild(b);
    });
    S.locked = false;
    render();
  }
  function sticker(text, bg, side) {
    const s = document.createElement('div'); s.className = 'sticker'; s.textContent = text;
    s.style.background = bg; s.style.color = '#111';
    if (side === 'boss') { s.style.right = '30%'; s.style.top = '18%'; } else { s.style.left = '30%'; s.style.bottom = '40%'; }
    $('arena').appendChild(s); setTimeout(() => s.remove(), 1000);
  }

  async function answer(i) {
    if (S.locked) return; S.locked = true;
    const btns = [...$('answers').children];
    $('answers').classList.add('wait');
    btns.forEach(b => b.disabled = true);
    btns[S.cur.c].classList.add('right');
    const hero = $('hero' + S.turn), boss = $('boss'), h = HEROES[S.turn];

    if (i === S.cur.c) {
      S.streak++;
      const crit = S.streak % 3 === 0, segs = crit ? 2 : 1;
      $('qmeta').innerHTML = '<span class="t">Correct</span>';
      type(`${h.name} used ${h.move}!${crit ? ' Critical hit!' : ''}`, 'ok');
      await wait(250);
      hero.classList.add('lunge'); await wait(220);
      replay(boss, 'hurt');
      S.boss = Math.max(0, S.boss - segs);
      sticker(crit ? `Crit −${segs * SEG_HP}` : `−${SEG_HP}`, crit ? '#D4FF3F' : '#fff', 'boss');
      render();
      await wait(240); hero.classList.remove('lunge');
      S.turn = (S.turn + 1) % HEROES.length;
    } else {
      btns[i].classList.add('wrong');
      S.streak = 0;
      $('qmeta').innerHTML = `Answer: <span class="t">${S.cur.a[S.cur.c].replace(/<[^>]+>/g, '')}</span>`;
      type(`Mr Eric Chan marks the ${h.name} wrong!`, 'no');
      await wait(250);
      boss.classList.add('boss-lunge'); await wait(220);
      replay(hero, 'hurt'); replay($('arena'), 'shake'); replay($('flash'), 'on');
      S.lives = Math.max(0, S.lives - 1);
      sticker('−1 life', '#FF4D1C', 'party');
      render();
      await wait(240); boss.classList.remove('boss-lunge');
    }

    await wait(1300);
    if (S.boss <= 0) return end(true);
    if (S.lives <= 0) return end(false);
    S.round++; next();
  }

  function end(won) {
    runId++;
    HEROES.forEach((_, i) => $('hero' + i).classList.toggle('down', !won));
    $('boss').style.opacity = won ? '.2' : '1';
    const b = $('banner');
    b.innerHTML = won
      ? `<h2>Boss cleared</h2><p>Beat Mr Eric Chan in ${S.round} rounds</p>`
      : `<h2 style="color:var(--orange)">Party down</h2><p>Lasted ${S.round} rounds · review and retry</p>`;
    const btn = document.createElement('button'); btn.className = 'btn'; btn.id = 'again'; btn.type = 'button';
    btn.textContent = won ? 'Fight again' : 'Try again';
    btn.onclick = reset;
    b.appendChild(btn); b.hidden = false;
    $('answers').innerHTML = ''; $('qmeta').textContent = '';
    $('say').textContent = won ? 'Mr Eric Chan is defeated. Unit 1 complete!' : 'Your party is out of lives.';
    btn.focus();
  }

  document.addEventListener('keydown', e => {
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 4 && S && S.cur && !S.locked && $('banner').hidden) answer(n - 1);
  });

  reset();
})();
</script>
</body>
</html>
